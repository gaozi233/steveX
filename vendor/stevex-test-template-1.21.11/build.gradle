plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url = 'https://maven.aliyun.com/repository/public' }
	maven { url = 'https://maven.aliyun.com/repository/central' }
	maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

loom {
    runs {
        memoryDebug {
            client()
            def debugDir = System.getProperty('stevex.memory.gameDir')
            runDir debugDir ?: 'run'
            vmArg '-Dstevex.memory.background=true'
            vmArg "-Dstevex.memory.hidden=${System.getProperty('stevex.memory.hidden', 'true')}"
            vmArg "-Dstevex.memory.verify=${System.getProperty('stevex.memory.verify', 'false')}"
        }
    }
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

sourceSets {
    leaseTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
tasks.register('testFeedbackWriterLease', JavaExec) {
    dependsOn leaseTestClasses
    classpath = sourceSets.leaseTest.runtimeClasspath
    mainClass = 'com.example.memworld.FeedbackWriterLeaseTest'
}
check.dependsOn testFeedbackWriterLease

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
