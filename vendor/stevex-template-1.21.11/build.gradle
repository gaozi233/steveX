plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	maven { url = 'https://maven.aliyun.com/repository/public' }
	maven { url = 'https://maven.aliyun.com/repository/central' }
	maven { url = 'https://maven.aliyun.com/repository/gradle-plugin' }
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

		// WebSocket server
		implementation 'org.java-websocket:Java-WebSocket:1.5.6'
		include 'org.java-websocket:Java-WebSocket:1.5.6'
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

// configure the maven publication
loom {
    runs {
        renderer {
            client()
            runDir 'run-renderer'
            programArgs '--username', 'SteveXRenderer', '--width', '960', '--height', '540',
                    '--quickPlayMultiplayer', System.getProperty('stevex.render.server', '127.0.0.1:25565')
            vmArgs '-Dstevex.ws.port=' + System.getProperty('stevex.render.port', '25550')
            vmArgs '-Dstevex.ws.host=127.0.0.1'
            vmArgs '-Dstevex.render.background=true'
            vmArgs '-Dstevex.render.hidden=' + System.getProperty('stevex.render.hidden', 'true')
            vmArgs '-Dstevex.render.onDemand=' + System.getProperty('stevex.render.onDemand', 'true')
        }
    }
}

sourceSets {
    demandTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

tasks.register('testRenderDemand', JavaExec) {
    dependsOn demandTestClasses
    classpath = sourceSets.demandTest.runtimeClasspath
    mainClass = 'name.modid.vision.RenderDemandTest'
}

check.dependsOn testRenderDemand

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
